<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Administer · 안전 쓰기 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #2d3142; --color-ink: #f5f5f5; --color-muted: #bfc0c0; --color-accent: #e38a6c;
      --font-sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Claude Administer</p>
    <h1>settings.json 은 이 길로만 쓴다</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="safe-write-dark-title safe-write-dark-desc">
        <title id="safe-write-dark-title">settings.json 안전 쓰기 흐름</title>
        <desc id="safe-write-dark-desc">설정 변경 요청이 파싱 검사, 백업, 담당 키 교체, 임시 파일 rename, 되읽기 검증을 차례로 거치고, 파싱 실패면 쓰지 않으며 검증 불일치면 백업에서 복구하는 흐름.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e38a6c"/></marker>
        </defs>
        <rect width="100%" height="100%" rx="12" fill="#2d3142"/>

        <!-- Arrows first -->
        <line x1="320" y1="88" x2="320" y2="120" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="216" x2="320" y2="248" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="304" x2="320" y2="336" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="392" x2="320" y2="424" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="480" x2="320" y2="512" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="608" x2="320" y2="640" stroke="#e38a6c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="420" y1="168" x2="540" y2="168" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="420" y1="560" x2="540" y2="560" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="328" y="226" width="32" height="12" rx="2" fill="#2d3142"/>
        <text x="344" y="235" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="328" y="618" width="32" height="12" rx="2" fill="#2d3142"/>
        <text x="344" y="627" fill="#e38a6c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="468" y="148" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="480" y="157" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="468" y="540" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="480" y="549" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start -->
        <rect x="220" y="40" width="200" height="48" rx="20" fill="#2d3142"/>
        <rect x="220" y="40" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="320" y="64" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">설정 변경 요청</text>
        <text x="320" y="78" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">toggle · autoUpdate</text>
        <!-- Decision 1 -->
        <polygon points="320,120 420,168 320,216 220,168" fill="#2d3142"/>
        <polygon points="320,120 420,168 320,216 220,168" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="320" y="166" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">settings.json</text>
        <text x="320" y="180" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">파싱 성공?</text>
        <!-- End: skip -->
        <rect x="540" y="144" width="200" height="48" rx="20" fill="#2d3142"/>
        <rect x="540" y="144" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="640" y="168" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">쓰지 않는다</text>
        <text x="640" y="182" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">file left untouched</text>
        <!-- Step 1 -->
        <rect x="220" y="248" width="200" height="56" rx="6" fill="#2d3142"/>
        <rect x="220" y="248" width="200" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="320" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">백업 먼저</text>
        <text x="320" y="288" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">settings.json.bak-&lt;ts&gt;</text>
        <!-- Step 2 -->
        <rect x="220" y="336" width="200" height="56" rx="6" fill="#2d3142"/>
        <rect x="220" y="336" width="200" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="320" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">담당 키만 바꾼다</text>
        <text x="320" y="376" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">owning key only · rest as read</text>
        <!-- Step 3 -->
        <rect x="220" y="424" width="200" height="56" rx="6" fill="#2d3142"/>
        <rect x="220" y="424" width="200" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="320" y="448" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">임시 파일에 쓰고 rename</text>
        <text x="320" y="464" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tmp write → rename()</text>
        <!-- Decision 2 -->
        <polygon points="320,512 420,560 320,608 220,560" fill="#2d3142"/>
        <polygon points="320,512 420,560 320,608 220,560" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="320" y="558" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">되읽어 검증</text>
        <text x="320" y="572" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">원본과 일치?</text>
        <!-- End: restore -->
        <rect x="540" y="536" width="200" height="48" rx="20" fill="#2d3142"/>
        <rect x="540" y="536" width="200" height="48" rx="20" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="640" y="560" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">백업에서 복구</text>
        <text x="640" y="574" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">restore .bak-&lt;ts&gt;</text>
        <!-- End: done (focal) -->
        <rect x="220" y="640" width="200" height="56" rx="20" fill="#2d3142"/>
        <rect x="220" y="640" width="200" height="56" rx="20" fill="rgba(227,138,108,0.10)" stroke="#e38a6c" stroke-width="1"/>
        <text x="320" y="664" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif" text-anchor="middle">완료</text>
        <text x="320" y="680" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">settings.json updated</text>

        <!-- Legend -->
        <line x1="88" y1="728" x2="872" y2="728" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="88" y="744" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="88" y="756" width="24" height="12" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="120" y="765" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif">시작 · 끝</text>
        <rect x="212" y="756" width="24" height="12" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="244" y="765" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif">단계</text>
        <polygon points="300,762 312,756 324,762 312,768" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="332" y="765" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif">판단 (분기)</text>
        <line x1="440" y1="762" x2="468" y2="762" stroke="#e38a6c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="476" y="765" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif">검증 통과 경로</text>
        <line x1="592" y1="762" x2="620" y2="762" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="628" y="765" fill="#bfc0c0" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif">실패 분기</text>
      </svg>
    </div>
  </div>
</body>
</html>
